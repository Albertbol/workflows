name: Supabase reset and seeding
description: Supabase reset and seeding

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: supabase/setup-cli@v1
      with:
        version: latest
    - uses: Albertbol/workflows/.github/actions/node-setup@main
    - shell: bash
      run: |
        cd functions
        npm ci
        cd ..
        npm ci
        if grep -q 'signing_keys_path' supabase/config.toml && [ ! -f supabase/signing_keys.json ]; then
          key=$(cd "$(mktemp -d)" && supabase gen signing-key --algorithm ES256 | head -n1)
          echo "[$key]" > supabase/signing_keys.json
        fi
        supabase link --project-ref $SUPABASE_PROJECT_ID
        supabase db reset --linked <<EOF
        y
        EOF
        sleep 10
        npm run db-reset:after


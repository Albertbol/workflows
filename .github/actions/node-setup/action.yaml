name: Setup node
description: "Setup node"
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache-dependency-path: "**/package-lock.json"
        cache: "npm"
